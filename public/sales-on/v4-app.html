<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>영업ON v4</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#0b1220;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:500px;margin:auto;min-height:100vh;padding:22px 18px 96px}.top h1{font-size:25px;margin:6px 0 20px}.top b{color:#ff6b35}.ey{font-size:11px;font-weight:850;letter-spacing:.12em;color:#8c96a8}.hero{background:linear-gradient(145deg,#0b1220,#1b2b47);color:#fff;border-radius:26px;padding:22px}.hero h2{font-size:19px;margin:8px 0}.num{font-size:46px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 22px}.stat{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:12px}.stat span{font-size:10px;color:#737d90}.stat b{display:block;font-size:22px;margin-top:5px}.view{display:none}.view.on{display:block}.scanbox,.panel{background:#fff;border:1px solid #e5e9f0;border-radius:22px;padding:14px}.scan{height:270px;border-radius:18px;background:linear-gradient(145deg,#0b1423,#16304f);display:grid;place-items:center;color:#fff;text-align:center;position:relative;overflow:hidden}.scan:after{content:"";position:absolute;left:30px;right:30px;height:1px;background:#ff7948;box-shadow:0 0 12px #ff7948;animation:s 2s infinite}@keyframes s{0%,100%{top:28%}50%{top:72%}}.btn{width:100%;border:0;background:linear-gradient(135deg,#ff6b35,#ff9e1b);color:#fff;border-radius:14px;padding:14px;font-weight:900}.cam{display:block;text-align:center;margin-top:10px}.note{font-size:11px;color:#7b8596;line-height:1.5;text-align:center;margin-top:9px}.ok{color:#0d8b70;font-weight:800}.err{color:#c74a2d;font-weight:800}.list{display:flex;flex-direction:column;gap:9px}.cust{width:100%;border:1px solid #e5e9f0;background:#fff;border-radius:18px;padding:14px;text-align:left;display:flex;gap:11px;align-items:center}.av{width:42px;height:42px;border-radius:14px;background:#edf1f6;display:grid;place-items:center;font-weight:900}.main{flex:1;min-width:0}.main b,.main span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main span{font-size:11px;color:#737d90;margin-top:4px}.search,input,textarea,select{width:100%;font:inherit;border:1px solid #e0e5ed;background:#fff;border-radius:14px;padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form{display:flex;flex-direction:column;gap:9px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,500px);height:76px;background:#fffffff2;border-top:1px solid #e5e9f0;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.nav button{border:0;background:transparent;font-size:11px;font-weight:850;color:#8d96a5}.nav button.on{color:#0b1220}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.back{display:none;position:fixed;inset:0;background:#08101d77;z-index:8}.back.on{display:block}.sheet{position:fixed;z-index:9;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,500px);max-height:90vh;overflow:auto;background:#f8f9fc;border-radius:28px 28px 0 0;padding:14px 18px 26px;transition:.22s}.sheet.on{transform:translate(-50%,0)}.handle{width:42px;height:5px;background:#d7dce4;border-radius:99px;margin:0 auto 14px}.st{display:flex;justify-content:space-between;gap:12px}.st h2{margin:0}.x{border:0;background:#e8ecf2;width:38px;height:38px;border-radius:12px}.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.qa a,.qa button{border:1px solid #e0e5ed;background:#fff;border-radius:13px;padding:11px;text-decoration:none;color:#111;text-align:center;font-size:11px;font-weight:850}.msg{background:#0f1a2d;color:#fff;border-radius:16px;padding:14px;line-height:1.6;font-size:12px;margin-top:12px}.raw{font-size:10px;color:#8b95a6;background:#f0f3f7;border-radius:12px;padding:10px;line-height:1.5;margin-top:8px}.head{margin:18px 0 10px}.head h2{margin:3px 0}.warn{background:#fff4e9;color:#a85b12;border:1px solid #ffd8ad;border-radius:14px;padding:11px;font-size:11px;line-height:1.5;margin-bottom:10px}</style></head><body><div class="app"><div class="top"><div><div class="ey" id="date"></div><h1>오늘도 관계를 <b>놓치지 않게.</b></h1></div></div><section class="view on" id="today"><div class="hero"><div class="ey">TODAY</div><h2>오늘 연락할 고객</h2><div class="num" id="dueN">0</div><div style="font-size:12px;color:#c6cfdd" id="hint"></div></div><div class="stats"><div class="stat"><span>전체 고객</span><b id="allN">0</b></div><div class="stat"><span>견적·상담</span><b id="talkN">0</b></div><div class="stat"><span>60일 미접촉</span><b id="oldN">0</b></div></div><div class="head"><div class="ey">NEXT ACTION</div><h2>먼저 연락할 고객</h2></div><div class="list" id="priority"></div></section><section class="view" id="scan"><div class="head"><div class="ey">SMART CAPTURE</div><h2>명함 스캔</h2></div><div class="scanbox"><div class="scan"><div><div style="font-size:36px">▣</div><b>명함을 촬영하세요</b><div style="font-size:11px;color:#bdc7d5;margin-top:7px">이름 · 직책 · 소속 · 전화번호 자동 인식</div></div></div><label class="btn cam">카메라 열기<input id="file" type="file" accept="image/*" capture="environment" hidden></label><div class="note" id="prog">명함 이미지는 기기에서 OCR 처리합니다.</div></div></section><section class="view" id="customers"><div class="head"><div class="ey">MY CUSTOMERS</div><h2>내 고객</h2></div><input class="search" id="q" placeholder="이름, 소속, 메모 검색"><div class="list" id="list" style="margin-top:10px"></div></section><section class="view" id="me"><div class="head"><div class="ey">MY SETTINGS</div><h2>내 영업 설정</h2></div><form class="form" id="pf"><input id="myName" placeholder="내 이름"><input id="myCompany" placeholder="회사/지사"><textarea id="tpl" rows="5" placeholder="인사문자 템플릿"></textarea><button class="btn">저장</button></form></section></div><nav class="nav"><button class="on" data-go="today"><i>⌂</i>오늘</button><button data-go="customers"><i>◎</i>고객</button><button data-go="scan"><i>▣</i>명함</button><button data-go="me"><i>◉</i>내정보</button></nav><div class="back" id="back"></div><div class="sheet" id="sheet"><div class="handle"></div><div id="sheetIn"></div></div><script>const K='saleson_v4',PK='saleson_profile_v4',L={new:'신규',talk:'상담',quote:'견적',client:'기존'};let cs=JSON.parse(localStorage.getItem(K)||'[]'),pf=JSON.parse(localStorage.getItem(PK)||'{}');const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],today=()=>new Date().toISOString().slice(0,10),future=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},days=d=>{if(!d)return 9999;return Math.floor((new Date()-new Date(d+'T00:00:00'))/864e5)},esc=s=>String(s||'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));function save(){localStorage.setItem(K,JSON.stringify(cs));render()}function go(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));$$('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.go===v));scrollTo(0,0)}function close(){$('#back').classList.remove('on');$('#sheet').classList.remove('on')}function card(c){return `<button class="cust" data-id="${c.id}"><span class="av">${esc((c.name||'?').slice(0,2))}</span><span class="main"><b>${esc(c.name||'이름 확인 필요')} ${esc(c.role||'')}</b><span>${esc(c.company||'소속 미확인')} · ${esc(c.phone||'번호 미확인')}</span></span>›</button>`}function render(){let due=cs.filter(c=>c.next&&c.next<=today()),talk=cs.filter(c=>['talk','quote'].includes(c.stage)),old=cs.filter(c=>days(c.last)>=60);$('#dueN').textContent=due.length;$('#allN').textContent=cs.length;$('#talkN').textContent=talk.length;$('#oldN').textContent=old.length;$('#hint').textContent=due.length?`${due.length}명의 고객이 다시 연락할 타이밍입니다.`:'오늘 예정된 연락은 없습니다.';let pri=cs.slice().sort((a,b)=>((b.next<=today())*5+days(b.last)/50)-((a.next<=today())*5+days(a.last)/50)).slice(0,4);$('#priority').innerHTML=pri.map(card).join('')||'<div class="panel note">명함을 등록해 시작해보세요.</div>';let q=($('#q')?.value||'').toLowerCase();$('#list').innerHTML=cs.filter(c=>!q||[c.name,c.role,c.company,c.memo].join(' ').toLowerCase().includes(q)).map(card).join('')||'<div class="panel note">고객이 없습니다.</div>'}function message(c){return(pf.tpl||'{고객명}님 안녕하세요. 오늘 인사드린 {회사} {내이름}입니다. 바쁘신 와중에 시간 내주셔서 감사합니다. 필요하신 부분 있으시면 언제든 편하게 연락주세요.').replaceAll('{고객명}',c.name||'고객').replaceAll('{회사}',pf.company||'회사').replaceAll('{내이름}',pf.name||'OOO')}function openC(id){let c=cs.find(x=>x.id===id);if(!c)return;$('#sheetIn').innerHTML=`<div class="st"><div><h2>${esc(c.name||'이름 확인 필요')} ${esc(c.role||'')}</h2><div class="ey">${esc(c.company||'소속 미확인')}</div></div><button class="x" id="x">×</button></div>${(!c.name||c.name==='이름 확인 필요'||!c.role)?'<div class="warn">OCR이 이름 또는 직책을 확실히 읽지 못했습니다. 명함을 보고 한 번만 확인해주세요.</div>':''}<div class="qa"><a href="tel:${c.phone||''}">📞 전화</a><a href="sms:${c.phone||''}?body=${encodeURIComponent(message(c))}">💬 문자</a><button id="done">✓ 연락완료</button></div><form class="form" id="edit"><div class="row"><input name="name" placeholder="이름" value="${esc(c.name==='이름 확인 필요'?'':c.name)}"><input name="role" placeholder="직책" value="${esc(c.role)}"></div><input name="company" placeholder="회사/소속" value="${esc(c.company)}"><input name="phone" placeholder="휴대폰" value="${esc(c.phone)}"><div class="row"><select name="stage">${Object.entries(L).map(([k,v])=>`<option value="${k}" ${c.stage===k?'selected':''}>${v}</option>`).join('')}</select><input type="date" name="next" value="${c.next||future(7)}"></div><textarea name="memo" rows="4" placeholder="관심상품, 약정만료, 특이사항">${esc(c.memo||'')}</textarea><button class="btn">변경 저장</button></form><div class="msg">${esc(message(c))}</div>${c.raw?`<details><summary class="note">OCR 원문 보기</summary><div class="raw">${esc(c.raw)}</div></details>`:''}`;$('#back').classList.add('on');$('#sheet').classList.add('on');$('#x').onclick=close;$('#done').onclick=()=>{c.last=today();c.next=future(30);save();close()};$('#edit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);c.name=f.get('name').trim()||'이름 확인 필요';c.role=f.get('role').trim();c.company=f.get('company').trim();c.phone=f.get('phone').trim();c.stage=f.get('stage');c.next=f.get('next');c.memo=f.get('memo').trim();save();close()}}function norm(v=''){let d=v.replace(/\D/g,'');if(d.startsWith('82'))d='0'+d.slice(2);if(d.length===11)return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;if(d.length===10)return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;return v.trim()}function parse(text=''){let lines=text.split(/\n+/).map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);let t=text.replace(/[Oo]/g,'0').replace(/[Il]/g,'1'),pm=t.match(/(?:\+?82[- .]?)?0?1[016789][- .]?\d{3,4}[- .]?\d{4}/),phone=pm?norm(pm[0]):'';let rr=/(고객서비스팀장|고객팀장|영업팀장|서비스팀장|대표이사|부사장|지사장|지점장|센터장|본부장|사업부장|실장|팀장|소장|상무|전무|이사|부장|차장|과장|대리|주임|사원|대표|사장|매니저|manager|director|ceo)/i,role='',ri=-1;for(let i=0;i<lines.length;i++){let m=lines[i].match(rr);if(m){role=m[0];ri=i;break}}let noise=/(본부|지사|지점|센터|고객서비스팀|고객지원팀|영업팀|서비스팀|사업부|주식회사|㈜|산업|테크|상사|물류|건설|전자|시스템|솔루션|보안|security|company|corp|office|mobile|email|tel|fax|전화|주소|www\.|http|@)/i,name='',idx=ri>=0?[ri,ri-1,ri+1,ri-2,ri+2,...lines.map((_,i)=>i)]:lines.map((_,i)=>i);for(let i of [...new Set(idx)]){if(i<0||i>=lines.length)continue;let s=lines[i].replace(rr,'').replace(/[^가-힣A-Za-z\s]/g,' ').replace(/\s+/g,' ').trim(),ko=s.replace(/\s+/g,'');if(/^[가-힣]{2,4}$/.test(ko)&&!noise.test(ko)){name=ko;break}if(/^[A-Za-z]{3,20}(?:\s+[A-Za-z]{2,20}){1,2}$/.test(s)&&!noise.test(s)){name=s;break}}let cr=/(주식회사|㈜|산업|테크|상사|물류|건설|전자|시스템|솔루션|보안|본부|지사|지점|센터|고객서비스팀|고객지원팀|영업팀|서비스팀|사업부|security|company|corp|inc)/i,company=lines.find(x=>cr.test(x)&&!rr.test(x))||'';return{name,role,company,phone,raw:text}}async function prep(file){try{let b=await createImageBitmap(file,{imageOrientation:'from-image'}),max=2300,s=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;let x=c.getContext('2d');x.filter='grayscale(1) contrast(1.55) brightness(1.08)';x.drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL('image/jpeg',.94)}catch{return file}}async function loadOCR(){if(window.Tesseract)return true;for(let src of['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'])try{await new Promise((ok,no)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});if(window.Tesseract)return true}catch{}return false}async function scan(file){if(!file)return;$('#prog').className='note';$('#prog').textContent='OCR 준비 중…';try{if(!(await loadOCR()))throw 0;let src=await prep(file),r=await Tesseract.recognize(src,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('#prog').textContent=`명함 읽는 중 ${Math.round((m.progress||0)*100)}%`}}),p=parse(r.data.text||'');if(!p.phone)throw 0;let key=p.phone.replace(/\D/g,''),dup=cs.find(c=>(c.phone||'').replace(/\D/g,'')===key);if(dup){$('#prog').className='note ok';$('#prog').textContent='기존 고객을 찾았습니다.';openC(dup.id);return}let c={id:crypto.randomUUID(),name:p.name||'이름 확인 필요',role:p.role||'',company:p.company||'',phone:p.phone,stage:'new',next:future(7),last:'',memo:'',raw:p.raw};cs.unshift(c);save();$('#prog').className='note ok';$('#prog').textContent=(p.name&&p.role)?'✓ 이름·직책까지 인식해 자동 저장했습니다.':'✓ 자동 저장 완료 · 이름/직책을 한 번 확인해주세요.';openC(c.id)}catch{$('#prog').className='note err';$('#prog').textContent='명함 인식에 실패했습니다. 빛 반사를 줄이고 명함을 화면 가득 다시 촬영해주세요.'}finally{$('#file').value=''}}document.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g)go(g.dataset.go);let c=e.target.closest('[data-id]');if(c)openC(c.dataset.id)});$('#file').onchange=e=>scan(e.target.files[0]);$('#back').onclick=close;$('#q').oninput=render;$('#pf').onsubmit=e=>{e.preventDefault();pf={name:$('#myName').value.trim(),company:$('#myCompany').value.trim(),tpl:$('#tpl').value.trim()};localStorage.setItem(PK,JSON.stringify(pf))};$('#myName').value=pf.name||'';$('#myCompany').value=pf.company||'';$('#tpl').value=pf.tpl||'{고객명}님 안녕하세요. 오늘 인사드린 {회사} {내이름}입니다. 바쁘신 와중에 시간 내주셔서 감사합니다. 필요하신 부분 있으시면 언제든 편하게 연락주세요.';$('#date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());render();</script></body></html>
