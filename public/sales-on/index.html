<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>영업ON</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script><style>
:root{--b:#f4f6fa;--w:#fff;--n:#0b1220;--m:#737d90;--l:#e5e9f0;--o:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--n);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;display:flex;justify-content:center}.app{width:min(100%,500px);min-height:100vh;padding:22px 18px 98px}.top{display:flex;justify-content:space-between;align-items:flex-start}.ey{font-size:11px;font-weight:800;letter-spacing:.12em;color:#8c96a8}.top h1{font-size:25px;line-height:1.25;margin:6px 0 20px;letter-spacing:-.04em}.top h1 b{color:var(--o)}button,input,textarea,select{font:inherit}.bell{width:44px;height:44px;border:1px solid var(--l);background:#fff;border-radius:15px}.view{display:none}.view.on{display:block}.hero{background:linear-gradient(145deg,#0b1220,#1b2b47);color:#fff;border-radius:28px;padding:23px;box-shadow:0 18px 40px #0b12202b}.hero .row{display:flex;justify-content:space-between}.hero small{font-weight:800;letter-spacing:.12em;color:#aeb9c9}.hero h2{font-size:20px;margin:10px 0}.num{font-size:52px;font-weight:900}.hero p{font-size:12px;color:#c6cfdd;line-height:1.65}.pri{border:0;background:linear-gradient(135deg,#ff6b35,#ff9e1b);color:white;border-radius:14px;padding:13px 15px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 24px}.stat{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px 10px;text-align:left}.stat b{display:block;font-size:23px;margin:8px 0 2px}.stat span{font-size:11px;color:var(--m)}.head{display:flex;justify-content:space-between;align-items:end;margin:18px 0 10px}.head h2,.head h3{margin:3px 0;font-size:20px}.head button{border:0;background:transparent;color:var(--o);font-weight:800}.list{display:flex;flex-direction:column;gap:9px}.empty{padding:30px;text-align:center;background:#fff;border:1px dashed #d8dee8;border-radius:20px;color:#929bad;font-size:12px}.card{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--l);border-radius:19px;padding:14px}.av{width:44px;height:44px;border-radius:15px;background:#edf1f6;display:grid;place-items:center;font-weight:900}.main{flex:1;min-width:0}.main b,.main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main b{font-size:14px}.main span{font-size:11px;color:var(--m);margin-top:4px}.tags{margin-top:7px}.tag{display:inline-block;background:#f0f3f7;color:#657085;padding:4px 7px;border-radius:8px;font-size:9px;font-weight:800;margin-right:4px}.tag.d{background:#e7faf4;color:#0d8b70}.tag.h{background:#fff0eb;color:#d74b18}.search{width:100%;border:1px solid var(--l);border-radius:15px;padding:13px;background:#fff;outline:none}.chips{display:flex;gap:6px;overflow:auto;margin:10px 0}.chip{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:99px;padding:8px 11px;font-size:11px;font-weight:800;color:#758096}.chip.on{background:#0b1220;color:#fff}.scanbox{background:#fff;border:1px solid var(--l);border-radius:25px;padding:12px}.scan{height:280px;border-radius:20px;background:linear-gradient(145deg,#0b1423,#16304f);display:grid;place-items:center;color:#fff;text-align:center;position:relative;overflow:hidden}.scan:after{content:"";position:absolute;left:30px;right:30px;height:1px;background:#ff7a48;box-shadow:0 0 12px #ff7a48;animation:s 2.4s infinite}@keyframes s{0%,100%{top:30%}50%{top:72%}}.scan b{font-size:17px}.scan span{display:block;color:#b9c5d6;font-size:11px;margin-top:7px}.cam{display:block;text-align:center;margin-top:10px}.note{text-align:center;font-size:10px;color:#8c96a8}.form{display:flex;flex-direction:column;gap:10px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--l);border-radius:14px;padding:12px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,500px);height:76px;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;color:#8f99aa;font-size:10px;font-weight:800}.nav button i{font-style:normal;display:block;font-size:19px;margin-bottom:3px}.nav button.on{color:#0b1220}.fab{width:58px!important;height:58px;background:linear-gradient(135deg,#ff6b35,#ff9733)!important;color:#fff!important;border-radius:18px!important;transform:translateY(-17px);box-shadow:0 12px 25px #ff6b3550;font-size:22px!important}.back{position:fixed;inset:0;background:#08101d77;z-index:8;display:none}.back.on{display:block}.sheet{position:fixed;z-index:9;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,500px);max-height:88vh;overflow:auto;background:#f8f9fc;border-radius:28px 28px 0 0;padding:12px 18px 26px;transition:.25s}.sheet.on{transform:translate(-50%,0)}.handle{width:40px;height:5px;background:#d6dbe3;border-radius:99px;margin:0 auto 14px}.st{display:flex;justify-content:space-between}.st h2{margin:0;font-size:21px}.x{border:0;background:#e9edf3;border-radius:10px;width:34px;height:34px}.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.qa a,.qa button{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px;text-align:center;text-decoration:none;color:#111;font-size:11px;font-weight:800}.memo{background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px;font-size:12px;line-height:1.6;margin:10px 0}.msg{background:#0f1a2d;color:#fff;border-radius:16px;padding:13px;font-size:12px;line-height:1.65;white-space:pre-wrap}.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,15px);background:#0b1220;color:#fff;padding:10px 14px;border-radius:12px;font-size:11px;opacity:0;transition:.2s;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="app"><div class="top"><div><div id="date" class="ey"></div><h1>오늘도 관계를 <b>놓치지 않게.</b></h1></div><button class="bell" id="bell">🔔</button></div>
<section class="view on" id="v-today"><div class="hero"><div class="row"><div><small>TODAY</small><h2>오늘 연락할 고객</h2></div><div id="dueN" class="num">0</div></div><p id="hint"></p><button class="pri" data-go="follow">오늘 고객 보기</button></div><div class="stats"><button class="stat"><span>🔥 집중관리</span><b id="hotN">0</b></button><button class="stat"><span>🧾 견적·제안</span><b id="quoteN">0</b></button><button class="stat"><span>🕰️ 60일 미접촉</span><b id="staleN">0</b></button></div><div class="head"><div><div class="ey">NEXT ACTION</div><h3>먼저 연락하면 좋은 고객</h3></div></div><div id="priority" class="list"></div></section>
<section class="view" id="v-customers"><div class="head"><div><div class="ey">MY CUSTOMERS</div><h2>내 고객</h2></div></div><input id="q" class="search" placeholder="이름, 회사, 메모 검색"><div class="chips"><button class="chip on" data-stage="all">전체</button><button class="chip" data-stage="new">신규</button><button class="chip" data-stage="talk">상담</button><button class="chip" data-stage="quote">견적</button><button class="chip" data-stage="client">기존</button></div><div id="customers" class="list"></div></section>
<section class="view" id="v-scan"><div class="head"><div><div class="ey">SMART CAPTURE</div><h2>명함 스캔</h2></div></div><div class="scanbox"><div class="scan"><div><div style="font-size:35px">▣</div><b>명함을 촬영하세요</b><span>전화번호 · 이메일 · 텍스트 자동 인식</span></div></div><label class="pri cam">카메라 열기<input id="card" type="file" accept="image/*" capture="environment" hidden></label><div id="prog" class="note">명함 이미지는 기기에서 OCR 처리합니다.</div></div></section>
<section class="view" id="v-follow"><div class="head"><div><div class="ey">FOLLOW UP</div><h2>오늘의 연락</h2></div></div><div id="follow" class="list"></div></section>
<section class="view" id="v-me"><div class="head"><div><div class="ey">MY SETTINGS</div><h2>내 영업 설정</h2></div></div><form id="pf" class="form"><input id="myName" placeholder="내 이름"><input id="myCompany" placeholder="회사/브랜드"><textarea id="tpl" rows="5" placeholder="인사문자 템플릿"></textarea><button class="pri">설정 저장</button></form></section></div>
<nav class="nav"><button class="on" data-go="today"><i>⌂</i>오늘</button><button data-go="customers"><i>◎</i>고객</button><button class="fab" data-go="scan">▣</button><button data-go="follow"><i>↺</i>연락</button><button data-go="me"><i>◉</i>내정보</button></nav><div class="back" id="back"></div><div class="sheet" id="sheet"><div class="handle"></div><div id="sheetIn"></div></div><div class="toast" id="toast"></div>
<script>
const K='saleson_v2',P='saleson_p2',L={new:'신규',talk:'상담',quote:'견적',client:'기존'};let cs=JSON.parse(localStorage.getItem(K)||'[]'),pf=JSON.parse(localStorage.getItem(P)||'{}'),stage='all';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],today=()=>new Date().toISOString().slice(0,10),diff=d=>{if(!d)return 9999;let a=new Date(d+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.floor((b-a)/864e5)},due=c=>c.next&&diff(c.next)>=0,stale=c=>diff(c.last)>=60,save=()=>{localStorage.setItem(K,JSON.stringify(cs));render()},esc=s=>String(s||'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a])),future=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},toast=x=>{let t=$('#toast');t.textContent=x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
if(!cs.length){cs=[{id:crypto.randomUUID(),name:'김성진',company:'세진테크',role:'대표',phone:'010-2345-6789',stage:'quote',hot:true,memo:'CCTV 4대 관심 · 기존 약정 11월 만료 · 오후 통화 선호',last:future(-9),next:today()},{id:crypto.randomUUID(),name:'이영수',company:'한결상사',role:'대표',phone:'010-9811-3320',stage:'client',hot:false,memo:'기존 고객 · 분기 인사',last:future(-71),next:future(-1)}];save()}
function card(c){return `<button class="card" data-id="${c.id}"><span class="av">${esc(c.name.slice(0,2))}</span><span class="main"><b>${esc(c.name)} ${esc(c.role||'')}</b><span>${esc(c.company)} · 마지막 ${c.last||'없음'}</span><span class="tags"><i class="tag">${L[c.stage]||'신규'}</i>${c.hot?'<i class="tag h">집중</i>':''}${due(c)?'<i class="tag d">연락</i>':''}</span></span>›</button>`}
function render(){let d=cs.filter(due);$('#dueN').textContent=d.length;$('#hotN').textContent=cs.filter(c=>c.hot).length;$('#quoteN').textContent=cs.filter(c=>c.stage==='quote').length;$('#staleN').textContent=cs.filter(stale).length;$('#hint').textContent=d.length?`${d.length}명의 고객이 다시 연락할 타이밍입니다.`:'오늘 예정된 연락은 없어요.';let pri=cs.slice().sort((a,b)=>(due(b)*40+b.hot*20+stale(b)*15)-(due(a)*40+a.hot*20+stale(a)*15)).slice(0,3);$('#priority').innerHTML=pri.map(card).join('')||'<div class="empty">명함을 등록해 시작해보세요.</div>';let q=($('#q')?.value||'').toLowerCase(),cl=cs.filter(c=>(stage==='all'||c.stage===stage)&&(!q||[c.name,c.company,c.memo].join(' ').toLowerCase().includes(q)));$('#customers').innerHTML=cl.map(card).join('')||'<div class="empty">고객이 없습니다.</div>';$('#follow').innerHTML=d.map(card).join('')||'<div class="empty">오늘 연락할 고객이 없습니다.</div>'}
function go(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.go===v));scrollTo(0,0)}
function msg(c){return (pf.tpl||'{고객명}님 안녕하세요. 오늘 인사드린 {회사} {내이름}입니다. 바쁘신 와중에 시간 내주셔서 감사합니다. 필요하신 부분 있으시면 언제든 편하게 연락주세요.').replaceAll('{고객명}',c.name).replaceAll('{회사}',pf.company||'회사').replaceAll('{내이름}',pf.name||'OOO')}
function openC(id){let c=cs.find(x=>x.id===id),m=msg(c);$('#sheetIn').innerHTML=`<div class="st"><div><h2>${esc(c.name)} ${esc(c.role||'')}</h2><div class="ey">${esc(c.company)} · ${esc(c.phone)}</div></div><button class="x" id="x">×</button></div><div class="qa"><a href="tel:${c.phone}">📞 전화</a><a href="sms:${c.phone}?body=${encodeURIComponent(m)}">💬 문자</a><button id="done">✓ 연락완료</button></div><div class="memo">${esc(c.memo||'메모 없음')}</div><form class="form" id="edit"><div class="two"><select name="stage">${Object.entries(L).map(([k,v])=>`<option value="${k}" ${c.stage===k?'selected':''}>${v}</option>`).join('')}</select><input type="date" name="next" value="${c.next||''}"></div><textarea name="memo" rows="4">${esc(c.memo||'')}</textarea><button class="pri">저장</button></form><h3>인사 문자</h3><div class="msg">${esc(m)}</div>`;$('#back').classList.add('on');$('#sheet').classList.add('on');$('#x').onclick=close;$('#done').onclick=()=>{c.last=today();c.next=future(30);save();close();toast('연락완료 · 30일 뒤 다시 알려드릴게요')};$('#edit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);c.stage=f.get('stage');c.next=f.get('next');c.memo=f.get('memo');save();close();toast('저장했어요')}}function close(){$('#back').classList.remove('on');$('#sheet').classList.remove('on')}
function newC(p={}){$('#sheetIn').innerHTML=`<div class="st"><h2>새 고객 등록</h2><button class="x" id="x">×</button></div><form class="form" id="new"><div class="two"><input name="name" placeholder="이름" value="${esc(p.name)}" required><input name="role" placeholder="직책" value="${esc(p.role)}"></div><input name="company" placeholder="회사" value="${esc(p.company)}"><input name="phone" placeholder="휴대폰" value="${esc(p.phone)}"><div class="two"><select name="stage"><option value="new">신규</option><option value="talk">상담</option><option value="quote">견적</option><option value="client">기존</option></select><input name="next" type="date" value="${future(7)}"></div><textarea name="memo" rows="4" placeholder="관심상품, 약정만료, 특이사항"></textarea><button class="pri">저장하고 인사 준비</button></form>`;$('#back').classList.add('on');$('#sheet').classList.add('on');$('#x').onclick=close;$('#new').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),phone=f.get('phone'),dup=cs.find(x=>phone&&x.phone.replace(/\D/g,'')===phone.replace(/\D/g,''));if(dup&&!confirm('같은 번호가 이미 있어요. 그래도 등록할까요?'))return;let c={id:crypto.randomUUID(),name:f.get('name'),role:f.get('role'),company:f.get('company'),phone,stage:f.get('stage'),next:f.get('next'),last:'',hot:false,memo:f.get('memo')};cs.unshift(c);save();close();openC(c.id)}}
async function scan(file){if(!file)return;go('scan');$('#prog').textContent='명함을 읽는 중…';let text='';try{let r=await Tesseract.recognize(file,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('#prog').textContent=`인식 중 ${Math.round(m.progress*100)}%`}});text=r.data.text||''}catch(e){}let lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean),pm=text.match(/01[016789][- .]?\d{3,4}[- .]?\d{4}/),pn=lines.find(x=>/^[가-힣]{2,4}(?:\s?(대표|이사|부장|차장|과장|팀장))?$/.test(x))||'',name=(pn.match(/[가-힣]{2,4}/)||[''])[0],role=(pn.match(/대표|이사|부장|차장|과장|팀장/)||[''])[0],company=lines.find(x=>/(주식회사|㈜|산업|테크|상사|물류|건설|시스템)/.test(x))||'';$('#prog').textContent='인식 완료 · 내용을 확인해주세요.';newC({name,role,company,phone:pm?pm[0]:''})}
document.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g)go(g.dataset.go);let c=e.target.closest('[data-id]');if(c)openC(c.dataset.id);let ch=e.target.closest('[data-stage]');if(ch){stage=ch.dataset.stage;$$('.chip').forEach(x=>x.classList.toggle('on',x===ch));render()}});$('#q').oninput=render;$('#card').onchange=e=>scan(e.target.files[0]);$('#back').onclick=close;$('#pf').onsubmit=e=>{e.preventDefault();pf={name:$('#myName').value,company:$('#myCompany').value,tpl:$('#tpl').value};localStorage.setItem(P,JSON.stringify(pf));toast('설정 저장')};$('#myName').value=pf.name||'';$('#myCompany').value=pf.company||'';$('#tpl').value=pf.tpl||'{고객명}님 안녕하세요. 오늘 인사드린 {회사} {내이름}입니다. 바쁘신 와중에 시간 내주셔서 감사합니다. 필요하신 부분 있으시면 언제든 편하게 연락주세요.';$('#bell').onclick=async()=>{if(!('Notification'in window))return toast('알림 미지원');let p=await Notification.requestPermission();toast(p==='granted'?'알림을 켰어요':'알림 권한이 필요해요')};$('#date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());render();
</script></body></html>
